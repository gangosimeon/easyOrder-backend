# ══════════════════════════════════════════════════════════════════════════════
#  nginx-og-map.conf — JeCréeMaBoutique
#  Détection des bots sociaux via le User-Agent
#
#  CHEMIN : /etc/nginx/conf.d/jecreemaboutique-bot-map.conf
#
#  Ce fichier est inclus dans le bloc http{} par nginx (via conf.d/).
#  Il DOIT être installé séparément du fichier de site.
#
#  Installation :
#    sudo cp nginx-og-map.conf /etc/nginx/conf.d/jecreemaboutique-bot-map.conf
#    sudo nginx -t && sudo systemctl reload nginx
# ══════════════════════════════════════════════════════════════════════════════

# ── Détection des bots sociaux ────────────────────────────────────────────────
#   $is_social_bot = 0 → humain → Angular SPA
#   $is_social_bot = 1 → bot    → Next.js SSR (meta OG)
#
#   Évaluée une seule fois par requête (optimisation nginx interne).

map $http_user_agent $is_social_bot {
    default 0;

    # Facebook / Instagram
    "~*facebookexternalhit"   1;
    "~*facebookcatalog"       1;
    "~*facebot"               1;

    # Twitter / X
    "~*twitterbot"            1;

    # WhatsApp
    "~*whatsapp"              1;

    # Telegram
    "~*telegrambot"           1;

    # LinkedIn
    "~*linkedinbot"           1;

    # Slack
    "~*slackbot"              1;
    "~*slack-imgproxy"        1;

    # Discord
    "~*discordbot"            1;

    # TikTok
    "~*tiktokbot"             1;
    "~*bytespider"            1;

    # Pinterest
    "~*pinterestbot"          1;

    # Snapchat / Viber / VK
    "~*snapchat"              1;
    "~*viber"                 1;
    "~*vkshare"               1;

    # Google / Bing / DuckDuckGo (référencement)
    "~*googlebot"             1;
    "~*bingbot"               1;
    "~*duckduckbot"           1;
    "~*applebot"              1;
    "~*yandexbot"             1;

    # Outils d'aperçu / validateurs
    "~*iframely"              1;
    "~*w3c_validator"         1;

    # Génériques
    "~*crawler"               1;
    "~*spider"                1;
}
