name: Build & Deploy
on:
push:
    branches: [main]

jobs:
build:
    runs-on: ubuntu-latest
    permissions:
     contents: read
     packages: write
    steps:
     - uses: actions/checkout@v4
     - uses: docker/login-action@v3
        with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}
     - uses: docker/build-push-action@v6
        with:
         context: .
         push: true
         tags: ghcr.io/${{ github.repository_owner }}/easyorder-backend:latest
     - name: Redeployer via Portainer
        run: curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK }}"