# ══════════════════════════════════════════════════════════════════════════════
#  nginx-og.conf — JeCréeMaBoutique
#  Proxy bot-aware : Angular SPA pour les humains, Next.js SSR pour les bots
#
#  PRÉREQUIS : nginx-og-map.conf installé dans /etc/nginx/conf.d/
#    sudo cp nginx-og-map.conf /etc/nginx/conf.d/jecreemaboutique-bot-map.conf
#
#  CHEMIN : /etc/nginx/sites-available/jecreemaboutique.com
#  LIEN   : sudo ln -s /etc/nginx/sites-available/jecreemaboutique.com \
#                      /etc/nginx/sites-enabled/jecreemaboutique.com
#
#  TESTER  : sudo nginx -t
#  APPLIQUER : sudo systemctl reload nginx
# ══════════════════════════════════════════════════════════════════════════════


# ══════════════════════════════════════════════════════════════════════════════
#  Serveur HTTPS principal
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    server_name www.jecreemaboutique.com jecreemaboutique.com;

    # ── SSL (Let's Encrypt / Certbot) ────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/jecreemaboutique.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jecreemaboutique.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:SSL:10m;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # ── Racine Angular ────────────────────────────────────────────────────────
    #   Après `ng build --configuration production`
    root  /var/www/jecreemaboutique/dist/gestion-boutique/browser;
    index index.html;

    # ── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/jecreemaboutique-access.log;
    error_log  /var/log/nginx/jecreemaboutique-error.log warn;

    # ── GZIP ─────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        image/svg+xml font/woff2;
    gzip_min_length 1024;

    # ── Headers de sécurité ───────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;


    # ════════════════════════════════════════════════════════════════════════
    #  ROUTAGE /shop/:slug — détection bot
    #
    #  Technique : error_page 418 → @nextjs_og
    #  Pourquoi pas `if` avec proxy_pass ?
    #    → Les directives proxy_ssl_* et proxy_set_header ne fonctionnent
    #      pas dans un bloc `if{}` en nginx. L'error_page vers une named
    #      location est la méthode recommandée pour éviter ce problème.
    # ════════════════════════════════════════════════════════════════════════

    location ~ ^/shop/([^/]+)$ {
        # Capture le slug dans une variable de requête
        set $shop_slug $1;

        # Si c'est un bot → renvoie un 418 (I'm a teapot) en interne
        # Le 418 est capturé par error_page et redirige vers @nextjs_og
        error_page 418 = @nextjs_og;
        if ($is_social_bot) { return 418; }

        # Humain → Angular SPA
        try_files $uri $uri/ /index.html;
    }

    # ── Named location : proxy vers Next.js pour les bots ────────────────────
    #   Accessible uniquement via l'error_page 418 ci-dessus.
    #   $shop_slug est disponible ici (variables de requête = scope global).

    location @nextjs_og {
        # Render.com héberge le backend Next.js en HTTPS
        proxy_pass https://easyorder-backend-wnku.onrender.com/shop/$shop_slug;

        # Indispensable pour HTTPS : indique au backend le vrai nom d'hôte
        proxy_ssl_server_name on;

        proxy_set_header Host              easyorder-backend-wnku.onrender.com;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Original-URI    $request_uri;

        # Timeouts généreux (Render.com free tier : cold start jusqu'à 15s)
        proxy_connect_timeout 15s;
        proxy_send_timeout    20s;
        proxy_read_timeout    30s;

        # Pas de buffering → retransmet la réponse SSR dès qu'elle arrive
        proxy_buffering off;
    }


    # ── Toutes les autres routes → Angular SPA ────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Assets statiques Angular — cache immuable (1 an) ─────────────────────
    #   Angular hash les noms de fichiers à chaque build → safe immutable
    location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires           365d;
        add_header        Cache-Control "public, immutable";
        access_log        off;
        try_files $uri =404;
    }

    # ── Protect .env et fichiers sensibles ───────────────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
}


# ══════════════════════════════════════════════════════════════════════════════
#  Redirection HTTP → HTTPS (avec www canonical)
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name www.jecreemaboutique.com jecreemaboutique.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.jecreemaboutique.com$request_uri;
    }
}


# ══════════════════════════════════════════════════════════════════════════════
#  Redirection non-www → www
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    server_name jecreemaboutique.com;

    ssl_certificate     /etc/letsencrypt/live/jecreemaboutique.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jecreemaboutique.com/privkey.pem;

    return 301 https://www.jecreemaboutique.com$request_uri;
}
